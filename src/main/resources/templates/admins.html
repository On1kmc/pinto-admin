<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Администраторы — Pinto Admin</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/public/css/style.css}">
</head>
<body>

<!-- Navbar -->
<nav class="app-nav">
    <a href="/" class="app-nav-brand">
        <span class="icon">🤖</span>
        Pinto Admin
    </a>
    <div style="display:flex;align-items:center;gap:10px;">
        <span style="color:rgba(255,255,255,.45);font-size:13px;" sec:authentication="name"></span>
        <a th:href="@{/accounts}" id="accountsLink"
           th:data-accounts-allowed="${isMainUser}"
           class="btn btn-outline-light btn-sm">
            <i class="bi bi-people me-1"></i>Учётные записи
        </a>
        <a th:href="@{/}" class="btn btn-outline-light btn-sm">
            <i class="bi bi-arrow-left me-1"></i>На главную
        </a>
    </div>
</nav>

<div class="page">

    <div class="card">
        <div class="card-header">
            <span class="card-title"><i class="bi bi-shield-check"></i> Администраторы</span>
            <span class="badge bg-secondary" th:text="${#lists.size(users)} + ' чел.'"></span>
        </div>
        <div class="table-responsive">
            <table class="table table-hover">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Username</th>
                    <th>Имя</th>
                    <th>Баланс</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="user : ${users}">
                    <td style="color:var(--muted)" th:text="${user.userId}"></td>
                    <td>
                        <a th:href="@{https://t.me/{u}(u=${user.username})}"
                           th:text="${user.username}"
                           target="_blank"
                           class="tg-link"></a>
                    </td>
                    <td th:text="${user.name}"></td>
                    <td>
                        <span class="badge bg-light text-dark border" th:text="${user.count} + ' фото'"></span>
                    </td>
                    <td style="text-align:right">
                        <a th:href="@{/users?id={id}(id=${user.userId})}" class="btn btn-sm btn-outline-primary">
                            <i class="bi bi-arrow-right-circle me-1"></i>Открыть
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>

<div class="modal fade" id="accessDeniedModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title"><i class="bi bi-shield-lock me-2"></i>Доступ ограничен</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                Раздел «Учётные записи» доступен только главным администраторам.
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Закрыть</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/public/js/app.js}"></script>
</body>
</html>
